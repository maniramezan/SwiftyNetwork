name: Build

on:
  push:
    branches: [ main ]
  # Validate stacked PRs as well as PRs targeting main.
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Format Lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            SWIFT_FORMAT="$(command -v swift-format)"
          else
            SWIFT_FORMAT="$(xcrun --find swift-format)"
          fi

          "$SWIFT_FORMAT" lint \
            --configuration .swift-format \
            --strict \
            --recursive \
            Sources \
            Tests

  build:
    needs: format
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The package's minimum toolchain and the latest release.
        swift-version: ["6.2", "6.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.swift-version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.swift-version }}-

      - name: Build package
        run: swift build -c release

  test:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.2", "6.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.swift-version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.swift-version }}-

      - name: Run tests with code coverage
        run: swift test --enable-code-coverage -v

      - name: Generate lcov coverage report
        if: matrix.swift-version == '6.2'
        run: |
          set -e
          PACKAGE_TESTS_XCTEST=".build/debug/SwiftyNetworkPackageTests.xctest"
          if [ -d "$PACKAGE_TESTS_XCTEST" ]; then
            xcrun llvm-cov export -format="lcov" "$PACKAGE_TESTS_XCTEST/Contents/MacOS/SwiftyNetworkPackageTests" -instr-profile .build/debug/codecov/default.profdata > coverage.lcov || true
            echo "Generated coverage.lcov"
            ls -l coverage.lcov || true
          else
            echo "Error: XCTest bundle not found at $PACKAGE_TESTS_XCTEST"
            ls -la .build/debug || true
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.swift-version == '6.2'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          flags: unittests
          verbose: true
          use_oidc: true
        env:
          # For private repos you can still provide CODECOV_TOKEN as a secret.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ios-test:
    needs: format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pick an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests on iOS simulators in parallel
        run: |
          set -euo pipefail
          # Parallel testing clones the simulator, so the suite fans out across workers.
          xcodebuild test \
            -scheme SwiftyNetwork \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            -derivedDataPath .build/ios-derived-data \
            -resultBundlePath .build/ios-test.xcresult

      # xcodebuild's console output names failing tests but not why they failed, and a crashed
      # test process only shows up as tests failing in 0 seconds. Print the failure messages and
      # keep the result bundle and crash reports so flaky failures can be diagnosed.
      - name: Summarize iOS test failures
        if: failure()
        run: |
          if [ -d .build/ios-test.xcresult ]; then
            xcrun xcresulttool get test-results tests --path .build/ios-test.xcresult --compact \
              | jq -r '.. | objects | select(.nodeType == "Test Case" and .result == "Failed")
                  | "\(.nodeIdentifier // .name): \([.children[]? | select(.nodeType == "Failure Message") | .name] | join(" | "))"' \
              || true
          fi
          mkdir -p .build/ios-crash-reports
          find ~/Library/Logs/DiagnosticReports -newer .build/ios-derived-data \
            \( -name '*xctest*' -o -name '*SwiftyNetwork*' \) \
            -exec cp {} .build/ios-crash-reports/ \; 2>/dev/null || true
          ls -l .build/ios-crash-reports

      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            .build/ios-test.xcresult
            .build/ios-crash-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Xcode framework type identity
        run: bash Tests/XcodeIntegration/verify.sh "${{ steps.simulator.outputs.udid }}"

  api-breakage:
    # A PR whose Conventional Commits title marks a breaking change (`feat!:`) is meant to break the API.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '!:')
    needs: format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      - name: Check for API breaking changes
        run: |
          set -euo pipefail
          baseline=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$baseline" ] || [ "${baseline%%.*}" -lt 2 ]; then
            echo "Latest release ${baseline:-none} predates 2.0.0; skipping."
            exit 0
          fi
          allowlist=()
          if [ -f .api-breakage-allowlist ]; then
            allowlist=(--breakage-allowlist-path .api-breakage-allowlist)
          fi
          echo "Comparing against $baseline"
          swift package diagnose-api-breaking-changes "$baseline" \
            --products SwiftyNetwork \
            ${allowlist[@]+"${allowlist[@]}"}
