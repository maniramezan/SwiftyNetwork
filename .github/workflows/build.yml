name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Format Lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            SWIFT_FORMAT="$(command -v swift-format)"
          else
            SWIFT_FORMAT="$(xcrun --find swift-format)"
          fi

          "$SWIFT_FORMAT" lint \
            --configuration .swift-format \
            --strict \
            --recursive \
            Sources \
            Tests

  build:
    needs: format
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build package
        run: swift build -c release

  test:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run tests with code coverage
        run: swift test --enable-code-coverage -v

      - name: Generate lcov coverage report
        run: |
          set -e
          PACKAGE_TESTS_XCTEST=".build/debug/SwiftyNetworkPackageTests.xctest"
          if [ -d "$PACKAGE_TESTS_XCTEST" ]; then
            xcrun llvm-cov export -format="lcov" "$PACKAGE_TESTS_XCTEST/Contents/MacOS/SwiftyNetworkPackageTests" -instr-profile .build/debug/codecov/default.profdata > coverage.lcov || true
            echo "Generated coverage.lcov"
            ls -l coverage.lcov || true
          else
            echo "Error: XCTest bundle not found at $PACKAGE_TESTS_XCTEST"
            ls -la .build/debug || true
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.lcov
          flags: unittests
          verbose: true
          use_oidc: true
        env:
          # For private repos you can still provide CODECOV_TOKEN as a secret.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
