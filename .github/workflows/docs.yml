name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate DocC documentation
        run: |
          set -euo pipefail

          rm -rf .build/docc-symbol-graphs .build/docc-site

          # dump-symbol-graph tries to load every target in the package graph,
          # including the synthesized test bundle, so the test target must be
          # built first or it fails with "Couldn't load module ... PackageTests".
          swift build --build-tests
          swift package dump-symbol-graph --minimum-access-level public

          mkdir -p .build/docc-symbol-graphs
          cp .build/*/symbolgraph/SwiftyNetwork.symbols.json .build/docc-symbol-graphs/

          xcrun docc convert \
            Sources/SwiftyNetwork/SwiftyNetwork.docc \
            --additional-symbol-graph-dir .build/docc-symbol-graphs \
            --output-dir .build/docc-site \
            --fallback-display-name SwiftyNetwork \
            --fallback-bundle-identifier com.manman.SwiftyNetwork \
            --fallback-default-module-kind library \
            --transform-for-static-hosting \
            --hosting-base-path SwiftyNetwork \
            --experimental-documentation-coverage \
            --coverage-summary-level brief \
            --warnings-as-errors

      - name: Add root redirect to documentation
        run: |
          cat > .build/docc-site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=documentation/swiftynetwork">
              <link rel="canonical" href="documentation/swiftynetwork">
              <title>SwiftyNetwork Documentation</title>
            </head>
            <body>
              <p>Redirecting to <a href="documentation/swiftynetwork">SwiftyNetwork documentation</a>…</p>
            </body>
          </html>
          EOF

      - name: Archive DocC site
        run: |
          # DocC's data/ JSON files can contain colons (e.g. init(_:).json), which
          # actions/upload-artifact rejects as invalid on NTFS. Zip first so only
          # the single archive file is validated, not each entry inside it.
          cd .build/docc-site
          zip -r -X ../docc-site.zip .

      - name: Upload DocC Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docc-site
          path: .build/docc-site.zip
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docc-site

  docs-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
