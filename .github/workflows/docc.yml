name: "Build and publish DocC documentation"

on:
  push:
    branches: [ 'main', 'master' ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'README.md'

jobs:
  docc:
    name: Build DocC and publish
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift and Xcode
        run: |
          swift --version || true
          xcodebuild -version || true

      - name: Generate DocC documentation
        run: |
          # Build documentation using xcodebuild and docc
          xcodebuild docbuild -scheme SwiftyNetwork \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=macOS'
          
          # Process DocC archive for static hosting
          $(xcrun --find docc) process-archive \
            transform-for-static-hosting /tmp/docbuild/Build/Products/Debug/SwiftyNetwork.doccarchive \
            --output-path docs \
            --hosting-base-path SwiftyNetwork

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
